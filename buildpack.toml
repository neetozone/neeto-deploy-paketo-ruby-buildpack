api = "0.7"

[buildpack]
  description = "A language family buildpack for building Ruby apps"
  homepage = "https://github.com/paketo-buildpacks/ruby"
  id = "neeto-deploy/ruby"
  version = "0.47.19"
  keywords = ["ruby"]
  name = "Paketo Buildpack for Ruby"

  [[buildpack.licenses]]
    type = "Apache-2.0"
    uri = "https://github.com/paketo-buildpacks/ruby/blob/main/LICENSE"

  [metadata]
    include-files = ["buildpack.toml"]

  [[order]]

    [[order.group]]
      id = "neeto-deploy/mri"
      version = "0.19.3"

    [[order.group]]
      id = "neeto-deploy/bundler"
      version = "0.8.48"

    [[order.group]]
      id = "neeto-deploy/bundle-install"
      version = "0.8.18"

    [[order.group]]
      id = "neeto-deploy/node-engine"
      optional = true
      version = "7.10.0"

    [[order.group]]
      id = "neeto-deploy/yarn"
      optional = true
      version = "2.3.1"

    [[order.group]]
      id = "neeto-deploy/yarn-install"
      optional = true
      version = "2.7.0"

    [[order.group]]
      id = "neeto-deploy/rails-assets"
      optional = true
